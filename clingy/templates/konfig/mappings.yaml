  - name: windsurf-settings
    source: code/settings.json
    target: ~/.config/Windsurf/User/settings.json
    group: code
    display_name: Windsurf Settings
  - name: vscode-keybindings
    source: code/keybindings.json
    target: ~/.config/Code/User/keybindings.json
