  - name: opencode themes
    source: opencode/themes
    target: ~/.config/opencode/themes
    group: agents
    display_name: OpenCode Themes
  - name: claude
    source: opencode/agent/architect.md
    target: ~/.claude/CLAUDE.md
    group: agents
    display_name: Claude Main Agent (opencode arch)
  - name: claude agents
    source: opencode/agent
    target: ~/.claude/agents
    group: agents
    display_name: Claude Agents
  - name: claude skill
    source: opencode/skill
    target: ~/.claude/skills
    group: agents
